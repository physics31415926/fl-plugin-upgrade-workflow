<html lang="zh-CN">
<head>

  <title>FL 多项目适配工作台</title>
  <style>
    :root {color-scheme:light;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f4f7fb;--ink:#18243a;--muted:#64748b;--line:#e1e8f0;--blue:#315bdb}

    button,select{font:inherit}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button,a,select{outline-offset:3px}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #95b5ff}
    .shell{max-width:1560px;margin:auto;padding:0 28px 40px}.topbar{min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:750}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,#204cbd,#6c8ef3);color:#fff}.sync{color:var(--muted);font-size:14px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:18px 0 24px}h1{font-size:30px;letter-spacing:-.035em;line-height:1.25;margin:0 0 9px}.intro p{margin:0;color:var(--muted);font-size:15px}.intro-note{font-size:14px;color:var(--muted);text-align:right;max-width:340px}
    .projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:22px}.project{min-width:0;background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px #192d4c0e;overflow:hidden;--accent:#315bdb}.project.sglang{--accent:#087c88}.project-head{padding:22px 24px 18px;border-top:4px solid var(--accent)}.project-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.project-title h2{font-size:23px;letter-spacing:-.035em;margin:0}.engine{font-size:13px;color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,white);padding:4px 9px;border-radius:6px;font-weight:650}.controls{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:18px}.field{min-width:0}.field label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:5px}select{width:100%;max-width:330px;min-height:38px;border:1px solid #c7d3e2;border-radius:7px;padding:6px 10px;background:white;color:var(--ink);font-size:14px}.button{white-space:nowrap;min-height:38px;padding:7px 12px;font-size:14px;color:#294768;border:1px solid #bac9df;border-radius:7px;background:#fff;cursor:pointer}.button:hover{background:#edf3ff}.button:disabled{opacity:.6;cursor:wait}.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:13px;font-size:13px;color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 24px 18px}.metric{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#f8fafd}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;margin-top:4px;font-size:22px;font-weight:650;line-height:1.3}.collection{padding:0 24px 16px;color:var(--muted);font-size:13px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}.notice{margin:0 24px 16px;padding:10px 12px;border-radius:8px;background:#fff7e8;border:1px solid #f0d8a9;color:#785117;font-size:14px;overflow-wrap:anywhere}.notice[hidden]{display:none}.table-wrap{overflow-x:auto;margin:0 24px}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th{font-size:12px;color:var(--muted);font-weight:650;padding:9px 4px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:13px 4px;border-bottom:1px solid #eef2f7;vertical-align:middle}td:first-child{min-width:118px}td:first-child strong{display:block;font-weight:650}.pr{font-size:12px;margin-top:3px;display:block}.pill{display:inline-block;border-radius:6px;padding:3px 7px;font-size:12px;font-weight:650;white-space:nowrap;background:#eef2f7;color:#63718a}.pill.passed,.pill.recorded_pass,.pill.merged{background:#e8f6ef;color:#117a55}.pill.failed{background:#fdecef;color:#bf4050}.pill.running,.pill.open,.pill.partial{background:#edf2ff;color:#315bdb}.pill.stale,.pill.missing,.pill.draft{background:#fff5e3;color:#a3660b}.tasks{padding:18px 24px 4px}.tasks h3{font-size:14px;margin:0 0 9px;font-weight:650}.task{display:flex;align-items:start;gap:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:9px;padding:10px 12px;font-size:14px}.task-copy{min-width:0;flex:1}.task-copy strong{font-size:13px;font-weight:650}.task-copy p{margin:4px 0 0;color:var(--muted);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.project-footer{padding:17px 24px 21px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:14px}.project-footer a{font-weight:650}.project-footer a:last-child{color:var(--muted)}.empty{color:var(--muted);font-size:14px;padding:14px 0}.footnote{font-size:13px;color:var(--muted);margin-top:22px}.error{margin:20px 0;padding:16px;border:1px solid #e3b2bb;border-radius:9px;background:#fff9fa;color:#a63545;font-size:14px}[hidden]{display:none!important}
    @media(max-width:1050px){.projects{gap:15px}.shell{padding:0 18px 30px}.project-head{padding:18px}.metrics{margin:0 18px 15px;gap:7px}.metric{padding:10px}.table-wrap{margin:0 18px}.collection{padding-left:18px}.tasks,.project-footer{padding-left:18px;padding-right:18px}.notice{margin-left:18px;margin-right:18px}.project-title h2{font-size:20px}}

  .acceptance-summary{font-size:12px;color:var(--muted);margin-top:5px;max-width:240px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.acceptance-more{font-size:12px;white-space:nowrap}.task details{margin-top:6px}.task pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;max-height:300px;overflow:auto}
.acceptance-open{display:inline-flex;align-items:center;gap:7px;border:0;padding:0;background:transparent;color:inherit;cursor:pointer;text-align:left;font:inherit}.acceptance-open:focus-visible{outline:3px solid #95b5ff;outline-offset:4px}.acceptance-dialog{width:min(1000px,92vw);max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--ink);background:#fff;box-shadow:0 24px 80px #18243a33}.acceptance-dialog::backdrop{background:#18243a66}.acceptance-dialog-head{display:flex;justify-content:space-between;align-items:center;gap:18px}.acceptance-dialog h2{font-size:20px;margin:0}.acceptance-dialog p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.acceptance-dialog .acceptance-table-wrap{overflow-x:auto}.acceptance-dialog table{width:100%;border-collapse:collapse;font-size:13px}.acceptance-dialog th,.acceptance-dialog td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap}.acceptance-dialog th{white-space:nowrap;color:var(--muted)}.acceptance-dialog caption{text-align:left;font-size:12px;color:var(--muted);padding:8px 0}.acceptance-dialog td:last-child{white-space:pre-wrap}.acceptance-dialog .dialog-close{padding:6px 11px;cursor:pointer;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font:inherit}.acceptance-dialog .original-pr{display:inline-block;margin-top:14px;font-size:13px}

    /* Keep primary actions close to the repository they affect. */
    :root{font-size:14px;--blue:#315bdb}
    .shell{max-width:1560px;padding:0 28px 36px}
    .topbar{min-height:72px;border-bottom:1px solid var(--line);margin-bottom:24px}
    .brand{font-size:16px}.top-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .mode-badge{font-size:12px;font-weight:650;color:#526681;background:#eaf0f7;border:1px solid #d7e1ee;border-radius:6px;padding:4px 9px}
    .intro{margin:0 0 22px;align-items:center}.intro h1{font-size:28px}.intro p{font-size:14px}.intro-note{font-size:13px;max-width:350px}
    .projects{gap:20px}.project{border-radius:13px;box-shadow:0 4px 16px #192d4c08}.project-head{padding:20px 22px 12px}
    .project-title h2{font-size:22px}.engine{font-size:12px}
    .controls{align-items:flex-end;margin-top:16px;gap:12px}.controls .field{flex:1}.controls select{max-width:100%;min-height:42px}
    .control-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 13px;border-radius:8px;font-weight:650;line-height:1.4}
    a.button:hover{text-decoration:none}.button.primary{color:white;background:#315bdb;border-color:#315bdb}.button.primary:hover{background:#234bc4;border-color:#234bc4}
    .button:disabled{cursor:wait;opacity:.6}.button[aria-busy="true"]::before{content:"";width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:busy-turn .8s linear infinite}
    @keyframes busy-turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.button[aria-busy="true"]::before{animation:none}}
    .card-feedback{min-height:20px;margin:9px 0 0;font-size:12px;color:var(--muted)}.meta{margin-top:12px;font-size:12px}
    .metrics{margin:0 22px 16px;gap:10px}.metric{padding:11px 12px}.metric strong{font-size:22px}.metric span{font-size:12px}
    .collection{padding:0 22px 12px}.notice{margin:0 22px 15px}.table-wrap{margin:0 22px}
    th{font-size:12px;padding:10px 4px}td{padding:11px 4px}.acceptance-open{min-height:36px;padding:3px 0}.acceptance-more{color:var(--blue)}
    .acceptance-open:hover .acceptance-more{text-decoration:underline}.acceptance-summary{font-size:12px;max-width:240px;margin-top:2px}
    .tasks{padding:17px 22px 4px}.task{background:#fbfcff}.tasks h3{font-size:14px}.task summary{cursor:pointer}
    .project-footer{padding:14px 22px 20px;align-items:center}.project-footer a:last-child{color:var(--blue);font-weight:550}.project-footer a.button{font-weight:650}
    .footnote{font-size:12px;line-height:1.7;margin-top:18px}.acceptance-dialog .dialog-close{min-height:40px;padding:8px 14px}
    @media(max-width:1120px){.shell{padding:0 20px 30px}.controls{align-items:stretch;flex-direction:column}.control-actions{justify-content:flex-start}.project-head{padding:18px 18px 12px}.metrics{margin:0 18px 14px}.table-wrap{margin:0 18px}.collection{padding-left:18px;padding-right:18px}.tasks,.project-footer{padding-left:18px;padding-right:18px}.notice{margin-left:18px;margin-right:18px}}
    @media(max-width:820px){.topbar{margin-bottom:20px;min-height:68px}.intro{gap:8px;align-items:flex-start}.intro h1{font-size:25px}.intro-note{max-width:none;text-align:left}.controls{flex-direction:row;align-items:flex-end}.project-head{padding-top:18px}.top-status{gap:8px}.sync{font-size:12px}}
    @media(max-width:520px){.table-wrap::before{content:"左右滑动可查看完整验收结果";display:block;margin:0 0 6px;color:var(--muted);font-size:11px}.shell{padding:0 14px 28px}.topbar{align-items:flex-start;padding:16px 0;gap:10px}.brand{font-size:15px}.top-status{width:100%;justify-content:space-between}.intro h1{font-size:24px}.intro-note{font-size:12px}.project-title h2{font-size:19px}.controls{flex-direction:column;align-items:stretch}.control-actions{display:grid;grid-template-columns:1fr 1.4fr}.button,select{min-height:44px}.project-footer{gap:10px}.project-footer .button{flex:1}.metric{padding:10px 8px}.metric strong{font-size:20px}.metric span{font-size:11px}.acceptance-open{min-height:44px}.acceptance-dialog{width:96vw;padding:16px}.acceptance-dialog h2{font-size:17px}}
  .project .table-wrap table{table-layout:fixed}.project .table-wrap th:nth-child(1){width:29%}.project .table-wrap th:nth-child(2){width:19%}.project .table-wrap th:nth-child(3){width:19%}.project .table-wrap th:nth-child(4){width:33%}.project .table-wrap td{overflow-wrap:anywhere}.project .table-wrap td:first-child{min-width:0}.project .acceptance-open{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:0;white-space:nowrap}.project .acceptance-summary{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px}.project .table-wrap td:first-child strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:18px}.project .table-wrap tbody tr{height:100px}
.pr-description{margin-top:24px;border-top:1px solid #dce3ed;padding-top:12px}.pr-description h4{margin:20px 0 10px}.acceptance-dialog .pr-description td:last-child{white-space:pre-wrap}.pr-description table{table-layout:auto}
</style>

<body>
<div class="shell">
  <header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">FL</span><span>适配工作台</span></div><div class="top-status"><a id="devices-link" href="/devices" hidden>设备资源</a><a id="access-shares-link" href="/access-shares" hidden>访问分享</a><span class="mode-badge" id="access-mode" hidden>局域网只读</span><span class="sync" id="sync" role="status" aria-live="polite">正在连接监控服务…</span></div></header>
  <main>
    <div class="intro"><div><h1>多项目适配进展</h1><p>vLLM-Plugin-FL 与 SGLang-Plugin-FL</p></div><div class="intro-note">选择仓库和分支，查看适配进展。<br>点击验收结果可查看测试明细。</div></div>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="projects" class="projects" aria-label="仓库适配进展"><div class="empty">正在读取两个仓库的分支、PR 和验收状态…</div></div>
    <p class="footnote" id="footnote">每 15 秒读取监控状态。各仓库可独立选择分支和读取最新远端状态；验收范围与测试版本以 PR 描述或本地记录为准。</p>
  </main>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cards = new Map();
  const labels={merged:'已合入',open:'待合入',draft:'草稿',closed:'已关闭',pending:'待合入',unknown:'未知',passed:'通过',recorded_pass:'验收记录',failed:'失败',running:'运行中',missing:'无证据',stale:'证据过期',partial:'部分通过',cancelled:'已取消',skipped:'跳过',reference:'PR 记录'};
  const taskLabels={prepared:'待启动',starting:'正在启动',running:'执行中',waiting_approval:'等待授权',waiting_input:'等待回答',interrupting:'正在中断',completed:'本轮结束',interrupted:'已中断',failed:'本轮异常',disconnected:'连接中断'};
  let loading=false,readOnly=false;
  function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=String(text);return node;}
  function appUrl(path,project,branch){const url=new URL(path.replace(/^\/+/,''),location.href);if(project)url.searchParams.set('project',project);if(branch)url.searchParams.set('branch',branch);return url.href;}
  function engineName(engine){return {sglang:'SGLang',vllm:'vLLM'}[engine]||engine||'Monitor';}
  function normalize(value){return {success:'passed',failure:'failed',error:'failed',queued:'running',in_progress:'running'}[value]||value||'unknown';}
  function effectiveCi(backend,head){const ci=backend.ci||{},status=normalize(ci.status);return status==='passed'&&ci.scope==='branch'&&ci.commit&&head&&ci.commit!==head?'stale':status;}
  function hasAcceptanceRecord(backend){return Array.isArray(backend.acceptance_records)&&backend.acceptance_records.some(record=>['passed','partial'].includes(record?.status));}
  function rawGateStatus(backend,head){const gate=backend.gate||{},status=normalize(gate.status);return ['passed','recorded_pass'].includes(status)&&!gate.tree_matches_head&&gate.latest_commit&&head&&gate.latest_commit!==head?'stale':status;}
  function effectiveGate(backend,head){const primary=backend.acceptance;if(primary&&['passed','partial','failed','pending','missing','reference','unknown'].includes(primary.status))return primary.status;if(hasAcceptanceRecord(backend))return 'passed';return rawGateStatus(backend,head);}
  function acceptanceResult(backend,head){
    const primary=backend.acceptance;
    if(primary&&['passed','partial','failed','pending','missing','reference','unknown'].includes(primary.status))return primary;
    const record=(backend.acceptance_records||[]).find(item=>['passed','partial'].includes(item?.status));
    if(record)return {...record,status:'passed',source:'local_record',summary:[record.summary,record.scope].filter(Boolean).join(' · ')};
    return {status:rawGateStatus(backend,head),source:'current_gate',summary:backend.gate?.detail||'尚无逐项验收结果',pr_number:backend.pr?.number,pr_url:backend.pr?.url};
  }
  function acceptanceText(status){return {passed:'通过',recorded_pass:'通过 · 验收记录',partial:'部分通过',failed:'未通过',pending:'待验收',missing:'暂无结果',reference:'PR 记录',unknown:'待确认',stale:'证据过期'}[status]||'待确认';}
  function acceptanceSource(result){return {pr_description:'PR 测试说明',local_record:'本地验收记录',current_gate:'逐项 Gate',pr_reference:'PR 记录'}[result.source]||'验收记录';}
  function badge(status,text){status=normalize(status);return el('span','pill '+(Object.hasOwn(labels,status)?status:'unknown'),text||labels[status]||'未知');}
  function githubLink(url,text){try{const target=new URL(url);if(target.protocol!=='https:'||target.hostname!=='github.com'||target.username||target.password)return null;const anchor=el('a','',text);anchor.href=target.href;anchor.target='_blank';anchor.rel='noopener noreferrer';return anchor;}catch(_){return null;}}
  function timeText(value){if(!value)return '尚未采集';const date=new Date(value);return Number.isFinite(date.getTime())?date.toLocaleString('zh-CN',{hour12:false}):'时间未知';}
  async function request(url,options={}){const response=await fetch(url,{cache:'no-store',credentials:'same-origin',signal:AbortSignal.timeout(90000),...options});const value=await response.json();if(!response.ok)throw new Error(value.error||'读取失败（HTTP '+response.status+'）');return value;}
  function makeCard(project){
    const root=el('article','project '+project.engine),header=el('div','project-head'),title=el('div','project-title'),heading=el('h2','',project.label),engine=el('span','engine',({sglang:'SGLang',vllm:'vLLM'}[project.engine]||project.engine||'Monitor'));title.append(heading,engine);
    const controls=el('div','controls'),field=el('div','field'),select=el('select'),label=el('label','','目标分支'),refresh=el('button','button','刷新状态'),createLink=el('a','button primary','＋ 新建任务'),controlActions=el('div','control-actions');select.id='branch-'+project.id;select.setAttribute('aria-label',project.label+' 目标分支');label.htmlFor=select.id;refresh.type='button';refresh.title='重新采集此分支的 PR、CI 和验收结果';refresh.setAttribute('aria-label',project.label+' 刷新状态');createLink.hidden=readOnly||project.sessions===false;field.append(label,select);controlActions.append(refresh,createLink);controls.append(field,controlActions);
    const meta=el('div','meta'),feedback=el('p','card-feedback','每 15 秒读取 · 每分钟采集');feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');header.append(title,controls,meta,feedback);const metrics=el('div','metrics'),counts={};for(const [key,label]of [['merged','代码合入'],['ci','适配 CI 通过'],['gate','验收通过']]){const box=el('div','metric'),value=el('strong','','—');box.append(el('span','',label),value);metrics.append(box);counts[key]=value;}
    const collection=el('div','collection'),notice=el('div','notice');notice.hidden=true;notice.setAttribute('role','status');const tableWrap=el('div','table-wrap'),table=el('table'),thead=el('thead'),tr=el('tr');for(const text of ['Backend / PR','代码合入','适配 CI','验收结果']){const th=el('th','',text);th.scope='col';tr.append(th);}thead.append(tr);const tbody=el('tbody');table.append(thead,tbody);tableWrap.append(table);
    const tasks=el('div','tasks'),footer=el('div','project-footer'),detail=el('a','button','查看分支进展'),taskLink=el('a','','查看任务 →');footer.append(detail,taskLink);root.append(header,metrics,collection,notice,tableWrap,tasks,footer);
    const card={root,heading,engine,select,refresh,meta,feedback,counts,collection,notice,tbody,tasks,detail,taskLink,createLink,project,branch:project.default_branch,snapshot:null,busy:false,generation:0};
    select.addEventListener('change',async()=>{if(card.busy)return;card.generation++;card.branch=select.value;clearSelectedBranch(card);setCardBusy(card,true,'正在读取分支…');try{feedback.textContent=await loadCard(card)?'每 15 秒读取 · 每分钟采集':'分支读取失败，可重试';}finally{setCardBusy(card,false);}});
    refresh.addEventListener('click',async()=>{if(card.busy)return;card.generation++;setCardBusy(card,true,'正在采集最新状态…');try{const data=await request(appUrl('api/branch-refresh',project.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({branch:card.branch})});if(data.branch&&data.branch!==card.branch)throw new Error('返回的分支与所选分支不一致，请重试');renderSnapshot(card,data);await loadSessions(card);feedback.textContent='已刷新 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false});}catch(error){showError(card,error.message);feedback.textContent='刷新未完成，可重试';}finally{setCardBusy(card,false);}});
    return card;
  }
  function setCardBusy(card,busy,message){card.busy=busy;card.refresh.disabled=busy;card.select.disabled=busy;card.refresh.setAttribute('aria-busy',String(busy));card.root.setAttribute('aria-busy',String(busy));card.refresh.textContent=busy?'刷新中…':'刷新状态';if(message)card.feedback.textContent=message;}
  function clearSelectedBranch(card){
    card.snapshot=null;card.engine.textContent=engineName(card.project.engine)+' · 读取中';
    card.meta.replaceChildren();card.collection.replaceChildren();card.notice.hidden=true;card.notice.textContent='';
    for(const value of Object.values(card.counts))value.textContent='—';
    const row=el('tr'),cell=el('td','empty','正在读取 '+card.branch+' 的适配进展…');cell.colSpan=4;row.append(cell);card.tbody.replaceChildren(row);
    card.tasks.replaceChildren();updateCardLinks(card);scheduleAlignment();
  }
  function showError(card,message){
    if(!card.snapshot){
      card.engine.textContent=engineName(card.project.engine)+' · 版本未识别';
      const row=el('tr'),cell=el('td','empty','此分支尚无可显示的采集结果，请刷新重试。');cell.colSpan=4;row.append(cell);card.tbody.replaceChildren(row);
    }
    card.notice.hidden=false;card.notice.textContent=message+(card.snapshot?'；保留此分支上次采集结果。':'');
  }
  function acceptanceLink(record,project,branch){
    if(!readOnly&&record.archive_available&&record.archive_url){
      try{const target=new URL(appUrl(record.archive_url,project,branch));if(target.origin===location.origin&&!target.username&&!target.password&&target.pathname.endsWith('/api/acceptance-record')){const anchor=el('a','','查看本地明细 ↗');anchor.href=target.href;anchor.target='_blank';anchor.rel='noopener noreferrer';return anchor;}}catch(_){}
    }
    try{const target=new URL(record.pr_url);if(!/^\/[^/]+\/[^/]+\/pull\/\d+\/?$/.test(target.pathname))return null;return githubLink(target.href,record.pr_number?'PR #'+record.pr_number+' 明细 ↗':'查看 PR 明细 ↗');}catch(_){return null;}
  }
  function openAcceptance(result, label, opener) {
    const dialog = el("dialog", "acceptance-dialog"), heading = el("div", "acceptance-dialog-head");
    dialog.setAttribute("aria-label", label + " · 验收明细");
    const close = el("button", "dialog-close", "关闭");close.type = "button";close.autofocus = true;
    heading.append(el("h2", "", label + " · 验收明细"), close);dialog.append(heading);
    dialog.append(el("p", "", result.summary || "尚无验收摘要"));
    dialog.append(el("p", "", result.source === "pr_description" ? "来源：PR 作者报告，测试版本与覆盖范围以原 PR 为准。" : "来源：" + acceptanceSource(result) + "，测试版本与范围见原始记录。"));
    const rows = (Array.isArray(result.rows) ? result.rows : []).filter(row => row && typeof row === "object").slice(0, 100);
    if (rows.length) {
      const wrap = el("div", "acceptance-table-wrap"), table = el("table"), head = el("thead"), header = el("tr"), body = el("tbody");
      table.append(el("caption", "", result.source === "pr_description" ? "PR 作者报告的验收明细" : "已有验收记录"));
      for (const name of ["验收项", "结果"]) {const cell = el("th", "", name);cell.scope = "col";header.append(cell);}head.append(header);
      for (const row of rows) {
        const item = el("tr"),name=el("td","",row.label||"验收项"),outcome=el("td");
        if(row.configuration)name.append(el("div","",row.configuration));
        outcome.append(el("span","",row.result||acceptanceText(row.status)));
        item.append(name,outcome);body.append(item);
      }
      table.append(head, body);wrap.append(table);dialog.append(wrap);
      if (result.rows_truncated || Number(result.rows_total) > rows.length) dialog.append(el("p", "", "当前展示 " + rows.length + " 条" + (Number.isInteger(result.rows_total) && result.rows_total > rows.length ? " / 共 " + result.rows_total + " 条" : "") + "；完整范围请查看原 PR。"));
    } else dialog.append(el("p", "empty", "暂无可识别的验收表格。可查看原 PR，或在分支详情中查看本地记录与逐项结果。"));
    const blocks = Array.isArray(result.description_blocks) ? result.description_blocks.slice(0,4000) : (Array.isArray(result.acceptance_tables) ? result.acceptance_tables : []);
    if(blocks.length){
      const section=el("details","pr-description");
      section.append(el("summary","","展开 PR 补充记录"));
      section.append(el("h3","","PR 描述记录"),el("p","","按原文顺序保留环境、测试、补充验证和限制说明，不额外计入通过数量。敏感信息已隐藏，代码块请查看原 PR。"));
      for(const block of blocks){
        if(block.type==="heading")section.append(el("h4","",block.text||""));
        else if(block.type==="paragraph")section.append(el("p","",block.text||""));
        else if(block.type==="table"&&Array.isArray(block.rows)){
          const wrap=el("div","acceptance-table-wrap"),table=el("table"),body=el("tbody");
          for(const [index,cells] of block.rows.slice(0,1000).entries()){
            if(!Array.isArray(cells))continue;
            const row=el("tr");
            for(const text of cells.slice(0,24)){const cell=el(index===0?"th":"td","",String(text||""));if(index===0)cell.scope="col";row.append(cell);}
            body.append(row);
          }
          table.append(body);wrap.append(table);section.append(wrap);
        }
      }
      dialog.append(section);
    }
    const original = acceptanceLink({...result, archive_available:false});
    if (original) {original.className = "original-pr";original.textContent = result.pr_number ? "查看原 PR #" + result.pr_number + " ↗" : "查看原 PR ↗";dialog.append(original);}
    close.addEventListener("click", () => dialog.close());
    dialog.addEventListener("cancel", event => {event.preventDefault();dialog.close();});
    dialog.addEventListener("close", () => {dialog.remove();if (opener?.isConnected) opener.focus();});
    document.body.append(dialog);dialog.showModal();return dialog;
  }
  function isActiveTask(task) {
    return !!task && !task.historical && ["prepared","starting","running","waiting_approval","waiting_input","interrupting"].includes(task.status);
  }
  function renderTasks(card,sessions){
    card.tasks.replaceChildren();const matching=(sessions||[]).filter(session=>session.branch===card.branch&&isActiveTask(session));
    if(readOnly&&!matching.length)return;card.tasks.append(el('h3','','适配任务'));
    if(!matching.length){card.tasks.append(el('div','empty','此分支暂无活跃任务'));return;}
    for(const session of matching.slice(0,6)){
      const box=el('div','task'),copy=el('div','task-copy'),backend=card.snapshot?.backends?.find(item=>item.id===session.backend)?.label||({corex:'iluvatar / 天数智芯',iluvatar:'iluvatar / 天数智芯'}[session.backend])||session.backend;
      const title=backend+' · '+(taskLabels[session.status]||session.status||'状态未知');
      if(!readOnly&&session.controllable!==false){const anchor=el('a','',title);anchor.href=appUrl('sessions?session='+encodeURIComponent(session.id),card.project.id,session.branch);copy.append(anchor);}else copy.append(el('strong','',title));
      copy.append(el('p','',session.source==='codex_native'?'Codex 原生子会话 · 只读跟踪':(({claude:'Claude',flagscale:'FlagScale Agent'}[session.provider]||'Codex')+' 看板任务')));
      if(!readOnly){const summary=session.progress_summary||session.last_agent_message||session.error||'等待任务进展记录';copy.append(el('p','',summary));if(session.source==='codex_native'&&(session.plan?.length||summary)){const detail=el('details'),body=el('pre','',summary);detail.append(el('summary','','查看最新进展'),body);for(const step of (session.plan||[]).slice(0,12))detail.append(el('p','',(step.status||'')+' · '+(step.step||step.text||'')));copy.append(detail);}}
      if(session.updated_at)copy.append(el('p','','任务更新 '+timeText(session.updated_at)));
      if(session.stale)box.append(badge('stale','等待新状态'));
      if(!readOnly&&session.pending_requests?.length)box.append(badge('running','待处理 '+session.pending_requests.length));box.append(copy);card.tasks.append(box);
    }
    if(matching.length>6)card.tasks.append(el('div','empty','另有 '+(matching.length-6)+' 个任务'));
  }

  function renderSnapshot(card,data){
    card.snapshot=data;card.branch=data.branch||card.branch;const options=[...new Set([card.branch,...(data.branches||[])].filter(Boolean))],prior=JSON.stringify([...card.select.options].map(option=>option.value));if(prior!==JSON.stringify(options)){card.select.replaceChildren();for(const branch of options){const option=el('option','',branch);option.value=branch;card.select.append(option);}}card.select.value=card.branch;
    card.engine.textContent=engineName(data.engine||card.project.engine)+(data.upstream_version||data.vllm_version?' '+(data.upstream_version||data.vllm_version):' · 版本未识别');card.engine.title='升级目标版本来自所选分支 pyproject.toml 的依赖声明';card.meta.replaceChildren();const head=githubLink(data.head_url,'HEAD '+String(data.head||'').slice(0,10))||el('span','mono','HEAD '+String(data.head||'未知').slice(0,10));head.title=data.head||'';card.meta.append(head,el('span','','采集于 '+timeText(data.observed_at)));
    const backends=[...(data.backends||[])].sort((a,b)=>(a.id!=="cuda")-(b.id!=="cuda")||String(a.label||a.id).localeCompare(String(b.label||b.id),"en",{sensitivity:"base"})),total=backends.length;card.counts.merged.textContent=backends.filter(item=>item.integration?.status==='merged').length+' / '+total;card.counts.ci.textContent=backends.filter(item=>effectiveCi(item,data.head)==='passed').length+' / '+total;card.counts.gate.textContent=backends.filter(item=>['passed','recorded_pass'].includes(effectiveGate(item,data.head))).length+' / '+total;
    const coverage = backends.find(item => item.gate?.total)?.gate;
    card.collection.replaceChildren();if(coverage)card.collection.append(el('span','','逐项覆盖 '+coverage.total+' 场景 · '+coverage.requests_total+' 请求 / backend'));
    const messages=[...(data.errors||[])];for(const warning of data.case_discovery?.warnings||[])messages.push('逐项场景来源提示（不影响 PR 验收记录）：'+(warning.detail||warning.source||warning.model||'待核对'));card.notice.hidden=!messages.length;card.notice.textContent=messages.join('；');
    card.tbody.replaceChildren();
    for(const backend of backends){
      const row=el('tr'),name=el('td');row.setAttribute('data-backend',backend.id);name.append(el('strong','',backend.label||backend.id));
      const pr=backend.pr&&githubLink(backend.pr.url,'PR #'+backend.pr.number);
      if(pr){pr.className='pr';name.append(pr);}else name.append(el('span','pr',backend.ci_enabled?'CI 已启用':'CI 未启用'));
      row.append(name);
      for(const [status,detail]of [[backend.integration?.status,backend.integration?.detail],[effectiveCi(backend,data.head),backend.ci?.detail]]){const cell=el('td');cell.append(badge(status));cell.title=detail||'';row.append(cell);}
      const result=acceptanceResult(backend,data.head),cell=el('td'),button=el('button','acceptance-open');button.type='button';button.setAttribute('aria-haspopup','dialog');button.setAttribute('aria-label',(backend.label||backend.id)+' 验收结果：'+acceptanceText(result.status)+'，查看表格');
      button.append(badge(result.status,acceptanceText(result.status)),el('span','acceptance-more','查看表格'));button.addEventListener('click',()=>openAcceptance(result,backend.label||backend.id,button));cell.append(button);
      if(result.summary)cell.append(el('div','acceptance-summary',result.summary));
      cell.title=[acceptanceSource(result),result.title,result.summary].filter(Boolean).join(' · ');row.append(cell);card.tbody.append(row);
    }
    if(typeof scheduleAlignment==='function')scheduleAlignment();
    updateCardLinks(card);
  }
  function updateCardLinks(card){
    card.detail.href=appUrl('monitor',card.project.id,card.branch);card.taskLink.href=appUrl('sessions',card.project.id,card.branch);card.taskLink.hidden=readOnly||card.project.sessions===false;if(card.createLink){card.createLink.href=appUrl('sessions',card.project.id,card.branch)+'#new-task';card.createLink.hidden=card.taskLink.hidden;}
  }

  function alignProjects(){
    const roots=[...cards.values()].map(card=>card.root);
    const selectors=['.project-head','.metrics','.collection','.notice','.table-wrap'];
    for(const root of roots){
      for(const selector of selectors)root.querySelector(selector).style.minHeight='';
      root.querySelector('.table-wrap').style.paddingTop='';
      for(const row of root.querySelectorAll('tbody tr'))row.style.height='';
    }
    if(window.innerWidth<=820||roots.length<2)return;
    const visualRows=new Map();
    for(const root of roots){const top=Math.round(root.getBoundingClientRect().top);if(!visualRows.has(top))visualRows.set(top,[]);visualRows.get(top).push(root);}
    for(const roots of visualRows.values()){
    for(const selector of ['.project-head','.metrics','.collection']){
      const nodes=roots.map(root=>root.querySelector(selector));
      const height=Math.max(...nodes.map(node=>node.getBoundingClientRect().height));
      nodes.forEach(node=>node.style.minHeight=height+'px');
    }
    const wraps=roots.map(root=>root.querySelector('.table-wrap'));
    const top=Math.max(...wraps.map(node=>node.getBoundingClientRect().top));
    wraps.forEach(node=>node.style.paddingTop=(top-node.getBoundingClientRect().top)+'px');
    const groups=new Map();
    roots.forEach(root=>root.querySelectorAll('tbody tr').forEach(row=>{
      const key=row.dataset.backend;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row);
    }));
    groups.forEach(rows=>{const height=Math.max(...rows.map(row=>row.getBoundingClientRect().height));rows.forEach(row=>row.style.height=height+'px');});
  }
  }
  function scheduleAlignment(){if(typeof requestAnimationFrame==='function')requestAnimationFrame(alignProjects);}
  async function loadSessions(card){const generation=card.generation,branch=card.branch;try{const data=await request(appUrl('api/adaptation-tasks',card.project.id));if(generation===card.generation&&branch===card.branch)renderTasks(card,data.tasks);}catch(error){if(generation===card.generation&&branch===card.branch)card.tasks.replaceChildren(el('div','empty','任务状态暂不可用：'+error.message));}}
  async function loadCard(card){
    const generation=card.generation,branch=card.branch;
    try{const data=await request(appUrl('api/branch-status',card.project.id,branch));if(generation!==card.generation||branch!==card.branch)return false;if(data.branch&&data.branch!==branch)throw new Error('返回的分支与所选分支不一致，请重试');renderSnapshot(card,data);await loadSessions(card);return true;}
    catch(error){if(generation===card.generation&&branch===card.branch)showError(card,error.message);return false;}
  }
  async function update(){
    if(loading)return;loading=true;const generations=new Map([...cards].map(([id,card])=>[id,card.generation]));try{const data=await request(appUrl('api/projects-status'));for(const entry of data.projects||[]){const card=cards.get(entry.id);if(!card||card.busy||card.generation!==generations.get(entry.id))continue;if(card.branch!==card.project.default_branch){await loadCard(card);continue;}if(entry.status){renderSnapshot(card,entry.status);renderTasks(card,entry.adaptation_tasks||entry.sessions);}if(entry.error)showError(card,entry.error);} $('sync').textContent='已连接 · 页面读取于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});$('error').hidden=true;}catch(error){$('sync').textContent='连接中断 · 正在等待重试';$('error').textContent=error.message+'；已有采集结果保留。';$('error').hidden=false;}finally{loading=false;}
  }
  async function loadAccessNavigation(){try{const capabilities=await request(appUrl('api/capabilities'));$('access-shares-link').hidden=capabilities.access_shares!==true;$('devices-link').hidden=capabilities.devices!==true;if(capabilities.shared_access===true){$('access-mode').textContent='分享管理权限';$('access-mode').hidden=false;}}catch(_){$('access-shares-link').hidden=true;}}
  async function initialize(){try{const data=await request(appUrl('api/projects'));readOnly=data.read_only===true;$('access-mode').hidden=!readOnly;loadAccessNavigation();$('projects').replaceChildren();for(const project of data.projects||[]){const card=makeCard(project);cards.set(project.id,card);$('projects').append(card.root);}if(!cards.size)throw new Error('尚未配置监控仓库');if(readOnly)$('footnote').textContent='团队只读看板每 15 秒读取状态，后台定期重新采集。可分别刷新各个仓库；原生子任务状态只读展示；机器配置、任务控制与原始私有存档由维护者在本机管理。';await update();setInterval(()=>{if(!document.hidden)update();},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)update();});}catch(error){$('error').textContent=error.message;$('error').hidden=false;$('sync').textContent='监控服务需要处理';}}
  window.addEventListener('resize',scheduleAlignment);
  if(document.fonts)document.fonts.ready.then(scheduleAlignment);
  initialize();
})();
</script>
