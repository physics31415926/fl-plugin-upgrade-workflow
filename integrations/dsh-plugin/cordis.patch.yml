- insert:
    - id: fl-upgrade-workflow
      name: '@local/fl-upgrade-workflow'
      config:
        # Absolute path to your fl-plugin-upgrade-workflow checkout.
        #
        # Leave empty (default) and the plugin clones its own dashboard repo
        # into ~/.dsh/fl-plugin-upgrade-workflow on first activation — no manual
        # clone needed. Set this only to point at a checkout you manage; an
        # explicit path is never cloned into.
        repoPath: ''
        # Clone the dashboard repo when repoPath is unset and nothing is at the
        # default directory. Set false to manage the checkout entirely by hand.
        autoClone: true
        # Loopback port the Python dashboard listens on.
        port: 8766
        # Leave empty to resolve `python` on PATH. Python 3.11+ is required.
        pythonPath: ''
        # Defaults to <repoPath>/runs/configured/projects.json when empty,
        # falling back to <repoPath>/projects.json.
        projectsConfig: ''
        # Collection runs inside the plugin: the dashboard process starts with
        # it, so device and PR data are there without anyone pressing Start.
        # Set false to keep the process manual.
        autoStart: true
        # Environment variable holding the GitHub token, resolved through the
        # Harness credential service and handed to the dashboard process.
        #
        # A NAME, never a value: this file is plain YAML in the profile, while
        # the secret itself stays in the encrypted credential store. The panel
        # collects it. Leave empty to opt out and rely on `gh auth login`.
        githubTokenEnv: GITHUB_TOKEN
