- insert:
    - id: fl-upgrade-workflow
      name: '@local/fl-upgrade-workflow'
      config:
        # Absolute path to your fl-plugin-upgrade-workflow checkout.
        # Required: the panel cannot do anything until this points at one.
        #   git clone https://github.com/physics31415926/fl-plugin-upgrade-workflow
        repoPath: ''
        # Loopback port the Python dashboard listens on.
        port: 8766
        # Leave empty to resolve `python` on PATH. Python 3.11+ is required.
        pythonPath: ''
        # Defaults to <repoPath>/runs/configured/projects.json when empty,
        # falling back to <repoPath>/projects.json.
        projectsConfig: ''
        # Start the dashboard process when the plugin activates.
        autoStart: false
